version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledgerline_secure_pass}
      POSTGRES_DB: ledgerline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    depends_on: 
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://ledgerline:${DB_PASSWORD:-ledgerline_secure_pass}@postgres:5432/ledgerline
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
